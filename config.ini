[network]
multicast_port = 22600

[database]
filename = pumphouse.db

[email]
sender = stephenson.martin@gmail.com
receiver = stephenson.martin@gmail.com

[monitor]
pump_threshold_watts = 1000
unexpected_alert_threshold_minutes = 7
# Silence longer than this (minutes) counts as a data gap: runs spanning it are ignored and
# missed treatments in an affected window are reported as 'could not verify'
max_gap_minutes = 10

[treatment]
# Each cycle: interval_days,utc_start_hour,utc_end_hour,min_duration_minutes,label
# Separate multiple cycles with |
#
# NOTE: treatment units run on local time. UTC windows must be adjusted at each clock change:
#   GMT (winter, UTC+0, late Oct–late Mar): ACTIVE on the 'cycles' line below
#   BST (summer, UTC+1, late Mar–late Oct): subtract 1 from each start/end hour
#     BST cycles = 14,0,1,15,14-night | 5,1,3,3,5-night | 3,3,4,8,3-night
#
# GMT:  14-night ~01:xx UTC | 5-night ~02-03:xx UTC | 3-night ~04:xx UTC
cycles = 14,1,2,15,14-night | 5,2,4,3,5-night | 3,4,5,8,3-night
summary_day = Monday
summary_hour_utc = 7
# Set to true to receive an email each time a scheduled treatment is confirmed.
# Disable once you are satisfied the schedule is tracking correctly.
send_confirmation_emails = true
